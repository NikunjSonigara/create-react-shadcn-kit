name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 to match the package's own engines (>=22.0.0) and ci.yml.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Pin npm to 11.x rather than @latest: npm 12 raised its floor to Node
      # >=22.22.2, so `npm@latest` broke the publish step on the runner's Node.
      # 11.x runs on Node >=22.9 and still provides OIDC trusted publishing
      # (added in 11.5.1) plus --provenance below.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
